<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#04101d" />
    <meta
      name="description"
      content="Meridian Cinema. Watch a wallet, a token, or the smart-money tide swim through a living reef."
    />
    <title>Meridian Cinema</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="habitat" aria-label="Interactive saltwater aquarium">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="A saltwater tank. Drag to turn it. Pinch to zoom. Trades arrive as fish with their names on them. Tap to feed. Space pauses. F enters fullscreen. H hides controls."
      ></canvas>
      <nav class="chrome" aria-label="Meridian">
        <a class="home-link" href="/reefscape/index.html" aria-label="Meridian Cinema">Meridian</a>
        <div class="scene-nav">
          <a href="/pipeline.html">Pipeline</a>
          <span aria-current="page">Reef</span>
        </div>
      </nav>
      <form id="watch" class="watch chrome" autocomplete="off">
        <div class="watch-modes" role="radiogroup" aria-label="What to watch">
          <label><input type="radio" name="watch-mode" value="ocean" checked /> Ocean</label>
          <label><input type="radio" name="watch-mode" value="wallet" /> Wallet</label>
          <label><input type="radio" name="watch-mode" value="token" /> Token</label>
          <label><input type="radio" name="watch-mode" value="name" /> Name</label>
        </div>
        <div class="watch-row">
          <label class="sr-only" for="watch-q">Address or name</label>
          <input id="watch-q" name="q" placeholder="Smart money ocean" disabled spellcheck="false" autocapitalize="off" />
          <label class="sr-only" for="watch-chain">Chain</label>
          <select id="watch-chain" disabled aria-label="Chain">
            <option value="ethereum" selected>Ethereum</option>
            <option value="solana">Solana</option>
            <option value="base">Base</option>
            <option value="arbitrum">Arbitrum</option>
            <option value="optimism">Optimism</option>
            <option value="polygon">Polygon</option>
            <option value="bnb">BNB</option>
            <option value="avalanche">Avalanche</option>
            <option value="all">All chains</option>
          </select>
          <label class="sr-only" for="watch-filter">Token feed</label>
          <select id="watch-filter" hidden aria-label="Token feed">
            <option value="all">Everything</option>
            <option value="trades">Trades only</option>
          </select>
          <button type="submit">Watch</button>
        </div>
        <p id="watch-status" role="status">Smart money ocean</p>
        <div id="watch-picks" class="watch-picks" hidden></div>
      </form>
      <footer class="chrome" aria-label="Aquarium controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="feed">Feed</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <div id="loading" role="status"><p>Loading aquarium…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
